<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Travel Planner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A7AAD"/>
      <stop offset="1" stop-color="#00557A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00283D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Caderno -->
  <g filter="url(#shadow)">
    <!-- capa/folhas -->
    <rect x="118" y="150" width="228" height="276" rx="22" fill="#FFF8EF"/>
    <!-- lombada -->
    <path d="M118 172 a22 22 0 0 1 22 -22 h26 v276 h-26 a22 22 0 0 1 -22 -22 z" fill="#FFDCBE"/>
    <!-- linhas da página -->
    <g stroke="#C9D6DF" stroke-width="8" stroke-linecap="round">
      <line x1="196" y1="232" x2="314" y2="232"/>
      <line x1="196" y1="276" x2="314" y2="276"/>
      <line x1="196" y1="320" x2="290" y2="320"/>
      <line x1="196" y1="364" x2="270" y2="364"/>
    </g>
    <!-- marcador de página -->
    <path d="M286 150 h30 v74 l-15 -13 l-15 13 z" fill="#E8833A"/>
  </g>

  <!-- Espiral -->
  <g fill="none" stroke="#5B6770" stroke-width="9" stroke-linecap="round">
    <path d="M150 182 h-30"/>
    <path d="M150 226 h-30"/>
    <path d="M150 270 h-30"/>
    <path d="M150 314 h-30"/>
    <path d="M150 358 h-30"/>
    <path d="M150 402 h-30"/>
  </g>

  <!-- Rota pontilhada saindo do caderno -->
  <path d="M210 334 C 256 292, 302 252, 346 218" fill="none" stroke="#E8833A" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="2 20"/>

  <!-- Avião -->
  <g transform="translate(418 122) rotate(48) scale(0.85)" filter="url(#shadow)">
    <path d="M0 -92
             C9 -92 13 -82 13 -70
             L13 -22 L92 22 L92 42 L13 17
             L13 56 L36 73 L36 88 L0 78
             L-36 88 L-36 73 L-13 56
             L-13 17 L-92 42 L-92 22 L-13 -22
             L-13 -70 C-13 -82 -9 -92 0 -92 Z"
          fill="#FFB870" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <!-- janela do cockpit -->
    <path d="M-6 -70 a6 9 0 0 1 12 0 v6 h-12 z" fill="#00557A" opacity="0.55"/>
  </g>
</svg>
