<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Travel Planner</title>
  <!--
    Estilo de linha: fundo liso, traço branco único de 20 px com pontas arredondadas.
    Silhueta do avião baseada no ícone "flight" do Material Icons (Apache 2.0).
  -->
  <rect width="512" height="512" fill="#00658E"/>

  <g transform="translate(-14 18)">
    <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <!-- Caderno -->
      <rect x="132" y="132" width="200" height="268" rx="28"/>
      <!-- Espiral: argolas atravessando a borda esquerda -->
      <path d="M112 182 h40 M112 242 h40 M112 302 h40 M112 362 h40"/>
      <!-- Linhas da página -->
      <path d="M196 214 h64 M196 266 h96 M196 318 h60"/>
    </g>

    <!-- Avião (preenchido) saindo do canto do caderno. O contorno grosso na cor do fundo abre o vão entre os dois. -->
    <g transform="translate(368 148) rotate(45) scale(8.4) translate(-11.5 -12)" stroke-linejoin="round">
      <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"
            fill="#00658E" stroke="#00658E" stroke-width="5"/>
      <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
    </g>
  </g>
</svg>
