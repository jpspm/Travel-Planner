<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Travel Planner</title>
  <!--
    Caderno aberto: à esquerda, o pin com o caminho tracejado (roteiro); à direita, a checklist.
    Fundo azul em quadrado arredondado; páginas brancas; detalhes em azul-marinho.
    design/make_android_icon.py usa estas mesmas formas para o ícone adaptativo do Android.
  -->
  <rect width="512" height="512" rx="122" fill="#4288EA"/>

  <!-- Páginas -->
  <g fill="#FFFFFF">
    <path d="M80,146 Q80,128 97,133.6 L244,182.2 Q249.5,184 249.5,189 L249.5,417 Q249.5,422 244.5,420.2 L97,368 Q80,362 80,345 Z"/>
    <path d="M432,146 Q432,128 415,133.6 L268,182.2 Q262.5,184 262.5,189 L262.5,417 Q262.5,422 267.5,420.2 L415,368 Q432,362 432,345 Z"/>
  </g>

  <g fill="none" stroke="#1B2E5C" stroke-linecap="round" stroke-linejoin="round">
    <!-- Caminho tracejado saindo do pin -->
    <path d="M147.3,293 C150,315 170,326 196,334 C218,341 232,355 236,376" stroke-width="9" stroke-dasharray="10 17"/>
    <!-- Checklist -->
    <path d="M291.8,226.6 L301.6,235 L317.7,216.7 M291.8,279.2 L301.6,287.6 L317.7,269.3 M291.8,331.8 L301.6,340.2 L317.7,321.9" stroke-width="7.5"/>
    <path d="M338.8,221.9 L403.3,207.9 M338.8,274.3 L403.3,260.2 M338.8,326.2 L403.3,310.7" stroke-width="8.5"/>
  </g>

  <!-- Pin, com o furo vazado -->
  <path fill="#1B2E5C" fill-rule="evenodd" stroke="#1B2E5C" stroke-width="3" stroke-linejoin="round"
        d="M147.3,274 L116.7,228.9 A36.5,36.5 0 1 1 177.9,228.9 Z M160.6,212.5 A13.3,13.3 0 1 0 134,212.5 A13.3,13.3 0 1 0 160.6,212.5 Z"/>
</svg>
