# CD: ao enviar uma tag vX.Y.Z, roda os testes, gera o APK de release assinado e publica a release no GitHub.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: APK assinado e release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # O gradlew foi versionado no Windows, sem permissão de execução.
      - run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Versão a partir da tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Chave de assinatura
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 não configurado"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Testes
        run: ./gradlew :shared:testAndroidHostTest

      - name: APK de release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease -PappVersion=${{ steps.version.outputs.name }}
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/travel-planner-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: Travel Planner ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
